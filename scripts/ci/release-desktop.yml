name: Release Desktop

# 构建 Mcode 桌面安装包（macOS / Windows / Linux）与命令行 / Web 发行包（mcode --web），
# 并发布到 GitHub Release。
# - 推送 v* 标签：自动构建并发布对应 Release
# - 手动触发：可指定 tag；未指定时使用 package.json 版本号 v<version>
# 发布铁律（AGENTS.md「版本发布铁律」）：每个验证通过的版本都必须合并到 main、
# 更新 README / 文档 / 版本号，并通过本工作流发布 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<package.json version>)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as pre-release"
        required: false
        default: false
        type: boolean
      mac_only:
        description: "只构建 macOS（arm64 + x64）测试包：不构建其他平台、不发布 Release，产物在本次运行的 Artifacts 里"
        required: false
        default: false
        type: boolean
      platforms:
        description: "补发：只构建这些平台并追加到已有 Release（逗号分隔，如 mac-x64 或 mac-x64,win-arm64）；留空构建全部"
        required: false
        default: ""
        type: string

# 安全：默认只读。只有最后的 release job 需要写 Release；构建 job 会执行大量第三方
# 依赖代码，不能拿到可写的 GITHUB_TOKEN（见各 job 的 permissions 与 persist-credentials）。
permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # 连接 Z.ai 正式后端（登录、Coding Plan 等），打正式 Mcode 身份安装包。
  MCODE_ENV: production
  NODE_ENV: production
  # 启用应用内自动更新：客户端从 GitHub Releases 的 latest*.yml 检查新版本。
  MCODE_AUTO_UPDATE: "1"
  HUSKY: "0"
  # GitHub Runner 位于海外，使用官方源下载 Electron 与 electron-builder 二进制。
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  # 跳过远程（SSH/WSL）资源预构建；本机桌面包不依赖 mock-cdn。
  MCODE_SKIP_REMOTE_ASSETS: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # 计算构建矩阵：mac_only 手动触发时只构建 macOS，节省 Runner 费用。
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MAC_ONLY: ${{ inputs.mac_only }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          ALL='[
            {"name":"macOS arm64","runner":"macos-14","os":"mac","arch":"arm64"},
            {"name":"macOS x64","runner":"macos-15-intel","os":"mac","arch":"x64"},
            {"name":"Windows x64","runner":"windows-latest","os":"win","arch":"x64"},
            {"name":"Windows ARM64","runner":"windows-11-arm","os":"win","arch":"arm64"},
            {"name":"Linux x64","runner":"ubuntu-22.04","os":"linux","arch":"x64"},
            {"name":"Linux ARM64","runner":"ubuntu-22.04-arm","os":"linux","arch":"arm64"}
          ]'
          if [ "$MAC_ONLY" = "true" ]; then
            M=$(echo "$ALL" | jq -c '[.[] | select(.os == "mac")]')
          elif [ -n "$PLATFORMS" ]; then
            M=$(echo "$ALL" | jq -c --arg p "$PLATFORMS" '($p | gsub(" ";"") | split(",")) as $want | [.[] | select((.os + "-" + .arch) as $k | $want | index($k))]')
            [ "$(echo "$M" | jq length)" -gt 0 ] || { echo "::error::platforms 没有匹配的平台：$PLATFORMS（可选 mac-arm64, mac-x64, win-x64, win-arm64, linux-x64, linux-arm64）"; exit 1; }
          else
            M=$(echo "$ALL" | jq -c '.')
          fi
          echo "matrix={\"include\":$M}" >> "$GITHUB_OUTPUT"
          echo "$M"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    # 苹果公证偶尔会排队很久（新账号首次可达数小时），放宽到 GitHub 托管 runner 的上限 6 小时，避免超时取消。
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Linux 在旧 glibc 基线（Ubuntu 22.04）上构建，产物兼容面更广。
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MCODE_TARGET_OS: ${{ matrix.os }}
      MCODE_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      # Windows 默认 core.autocrlf=true，会改写按哈希校验的资源文件。
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Setup Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # deb/rpm/pacman 由 fpm 生成，需要 rpmbuild 与 bsdtar。
      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools xz-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与 pnpm bootstrap 相同的顺序：先准备桌面本地运行资源，再构建各 workspace 包
      - name: Prepare desktop runtime assets
        run: pnpm prepare:desktop-runtime

      - name: Build workspace packages
        run: pnpm run build:bootstrap

      # macOS 正式签名 + 公证（需要仓库 Secrets，见 docs/macos-signing.md）：
      #   MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD：Developer ID Application 证书（含私钥）
      #   APPLE_API_KEY_P8_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER：App Store Connect API Key（公证用）
      # 未配置证书时自动退回 ad-hoc 签名（用户首次打开需要“仍要打开”），不会让构建失败。
      - name: Import macOS signing certificate
        id: macsign
        if: matrix.os == 'mac'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_P12_BASE64:-}" ]; then
            echo "::warning::未配置 MAC_CERT_P12_BASE64，本次 macOS 包仅 ad-hoc 签名、未公证，用户下载后会被 Gatekeeper 拦截。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/mcode-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::证书里没有找到 Developer ID Application 身份（是不是导出成了 Apple Distribution / Apple Development？）"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          {
            echo "MCODE_ENABLE_MAC_SIGN=1"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "CSC_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"
          if [ -n "${APPLE_API_KEY_P8_BASE64:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            {
              echo "APPLE_API_KEY=$API_KEY_PATH"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 App Store Connect API Key，本次只签名不公证。"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Bundle desktop installer
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          # macOS 打包内含 .app 公证 + staple，staple 会访问苹果 CloudKit，偶发网络中断（Error 68）
          # 会让整个打包失败。mac 最多重试 3 次（重新提交公证通常几分钟），其他平台只跑一次。
          max=1
          [ "$TARGET_OS" = "mac" ] && max=3
          for attempt in $(seq 1 "$max"); do
            pnpm bundle:desktop -- --os "$TARGET_OS" --arch "$TARGET_ARCH" --skip-prepare --skip-build && exit 0
            [ "$attempt" = "$max" ] && { echo "::error::打包连续失败 $max 次"; exit 1; }
            echo "::warning::打包第 $attempt 次失败，60 秒后重试"
            sleep 60
          done

      # .app 已在 electron-builder 内公证 + staple；dmg 是新文件，需要再单独公证并 staple，
      # 这样用户离线双击 dmg 也能通过 Gatekeeper。
      - name: Notarize and staple macOS dmg
        if: matrix.os == 'mac' && steps.macsign.outputs.notarize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(packages/desktop/dist/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo "no dmg found" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 150m --output-format json | tee "$RUNNER_TEMP/notary.json"
            status="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")"
            if [ "$status" != "Accepted" ]; then
              id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")"
              xcrun notarytool log "$id" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              echo "::error::dmg 公证失败：$status"
              exit 1
            fi
            # staple/validate 要访问苹果 CloudKit 取票据，偶发网络中断（Error 68 / -1005）；重试几次。
            for attempt in 1 2 3 4 5; do
              if xcrun stapler staple "$dmg" && xcrun stapler validate "$dmg"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::stapler 连续失败：$dmg"
                exit 1
              fi
              echo "stapler 第 $attempt 次失败，$((attempt * 20)) 秒后重试"
              sleep $((attempt * 20))
            done
          done
          # electron-builder 的 blockmap 基于 staple 前的 dmg 计算，staple 后需重新生成，避免增量更新校验失败。
          # （mac 自动更新走 zip，dmg.blockmap 仅作参考，这里直接删除过期文件。）
          rm -f packages/desktop/dist/*.dmg.blockmap

      # .app 签名必须完整一致，否则下载后会被 Gatekeeper 判为“已损坏”。
      # 已公证时额外用 spctl 模拟用户下载后的 Gatekeeper 判定，不通过直接失败，杜绝把坏包发出去。
      - name: Verify macOS app signature
        if: matrix.os == 'mac'
        shell: bash
        env:
          MAC_NOTARIZED: ${{ steps.macsign.outputs.notarize }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(packages/desktop/dist/mac*/*.app)
          [ ${#apps[@]} -gt 0 ] || { echo "no .app found" >&2; ls -R packages/desktop/dist | head -50; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier|Signature|Sealed Resources|flags"
            if [ "${MAC_NOTARIZED:-}" = "true" ]; then
              # stapler validate 要访问苹果 CloudKit，偶发网络中断（Error 68），重试几次。
              for attempt in 1 2 3 4 5; do
                xcrun stapler validate "$app" && break
                [ "$attempt" = 5 ] && { echo "::error::stapler validate 连续失败：$app"; exit 1; }
                echo "stapler validate 第 $attempt 次失败，$((attempt * 20)) 秒后重试"
                sleep $((attempt * 20))
              done
              spctl -a -vvv -t exec "$app"
            fi
          done
          if [ "${MAC_NOTARIZED:-}" = "true" ]; then
            for dmg in packages/desktop/dist/*.dmg; do
              spctl -a -vvv -t open --context context:primary-signature "$dmg"
            done
          fi

      - name: Cleanup macOS signing keychain
        if: always() && matrix.os == 'mac' && steps.macsign.outputs.enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mcode-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          cd packages/desktop/dist
          ls -la
          for f in *.dmg *.zip *.exe *.AppImage *.deb *.rpm *.pkg.tar.zst *.blockmap; do
            [ -f "$f" ] || continue
            # 发布资产名不带空格，便于下载链接使用
            cp "$f" "../../../release-artifacts/${f// /-}"
          done
          # 自动更新清单：同一平台不同架构的文件名会冲突（win x64/arm64 都叫 latest.yml，
          # mac 两个架构都叫 latest-mac.yml）。这里加架构后缀暂存，发布阶段再合并/还原。
          for f in latest*.yml; do
            [ -f "$f" ] || continue
            cp "$f" "../../../release-artifacts/update-${{ matrix.os }}-${{ matrix.arch }}--$f"
          done
          ls -la ../../../release-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcode-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  # 命令行 / Web 发行包（mcode --web）：纯 Node 运行包，一个 tar.gz 覆盖 macOS / Linux / Windows
  # 的 x64 与 arm64（原生模块按平台分目录随包分发）。在 Linux 上构建并做发行包冒烟测试。
  build-cli:
    name: Build CLI / Web bundle
    if: ${{ inputs.mac_only != true && inputs.platforms == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Setup Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Distribution unit tests
        run: node --test scripts/mcode-distribution.test.mjs

      - name: Build mcode bundle
        run: pnpm build:mcode

      - name: Smoke test bundle (TUI + Web + token + WebSocket origin)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/mcode-distribution-smoke.mjs "dist/mcode/releases/$VERSION/mcode-$VERSION.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcode-cli-bundle
          path: dist/mcode/github-release/*
          if-no-files-found: error
          retention-days: 14

  # 单个平台失败（例如苹果公证排队超时）不再阻塞整个发布：已成功的平台先发，
  # 失败的平台之后用 platforms 输入补发，追加到同一 Release。
  release:
    name: Publish GitHub Release
    needs: [build, build-cli]
    if: ${{ always() && inputs.mac_only != true && needs.build.result != 'cancelled' && (needs.build-cli.result == 'success' || (inputs.platforms != '' && needs.build-cli.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          # 通过 env 中转，避免把 ${{ }} 表达式直接拼进 shell（脚本注入）。
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 补发且构建失败时可能没有任何产物；先建目录，保证后续步骤给出明确错误而不是找不到工作目录。
      - name: Prepare release directory
        run: mkdir -p dist-release

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      # 补发时先取回同一 Release 已有的更新清单，合并后再整体覆盖，避免丢掉其他平台的条目。
      - name: Fetch existing update manifests (back-fill)
        if: ${{ inputs.platforms != '' }}
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          [ "$BUILD_RESULT" = "success" ] || { echo "::error::补发的平台构建失败（$BUILD_RESULT），不修改 Release：$TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::补发需要已存在的 Release：$TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'latest*.yml' --clobber || true
          ls -la

      - name: Assemble auto-update manifests
        working-directory: dist-release
        run: |
          ls -la update-* || true
          node "$GITHUB_WORKSPACE/scripts/ci/merge-update-manifests.mjs" .
          rm -f update-*--latest*.yml
          ls -la latest*.yml

      - name: Generate checksums
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          BACKFILL: ${{ inputs.platforms != '' }}
        run: |
          sha256sum $(ls | grep -v '^latest.*\.yml$' | grep -v '^latest\.json$' | grep -v '^SHA256SUMS\.txt$') > SHA256SUMS.new
          if [ "$BACKFILL" = "true" ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O SHA256SUMS.old 2>/dev/null; then
            # 已有条目保留，本次重建的同名文件以新哈希为准。
            awk 'NR==FNR { new[$2]=1; print; next } !($2 in new)' SHA256SUMS.new SHA256SUMS.old | sort -k2 > SHA256SUMS.txt
            rm -f SHA256SUMS.old
          else
            mv SHA256SUMS.new SHA256SUMS.txt
          fi
          rm -f SHA256SUMS.new
          cat SHA256SUMS.txt

      # 发布前确认命令行发行包三件套齐全，并与 latest.json 中的版本、哈希一致。
      - name: Verify CLI bundle assets
        if: ${{ inputs.platforms == '' }}
        working-directory: dist-release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          test -f install.sh
          test -f "mcode-$VERSION.tar.gz"
          node -e '
            const fs = require("node:fs"), crypto = require("node:crypto");
            const meta = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const version = process.argv[1];
            if (meta.version !== version) throw new Error(`latest.json version ${meta.version} != ${version}`);
            const sha = crypto.createHash("sha256").update(fs.readFileSync(meta.tarball)).digest("hex");
            if (sha !== meta.sha256) throw new Error(`sha256 mismatch for ${meta.tarball}`);
            console.log(`CLI bundle ${meta.tarball} ok (${sha})`);
          ' "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          BACKFILL: ${{ inputs.platforms != '' }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          # 补发：只追加/覆盖本次构建的资产与合并后的清单，保留 Release 说明（由维护者在补发后更新）。
          if [ "$BACKFILL" = "true" ]; then
            gh release upload "$TAG" dist-release/* --clobber
            exit 0
          fi
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          Mcode ${TAG} — 基于 ZCode 开源项目改名构建（保留 Z.ai / BigModel 登录）。

          本版本更新内容见仓库 README 的「更新」章节。

          ## 桌面版下载
          - macOS Apple Silicon：\`Mcode-*-mac-arm64.dmg\`
          - macOS Intel：\`Mcode-*-mac-x64.dmg\`
          - Windows x64：\`Mcode-*-win-x64.exe\`
          - Windows ARM64：\`Mcode-*-win-arm64.exe\`
          - Linux x64 / ARM64：\`.deb\`（Debian/Ubuntu）、\`.rpm\`（Fedora/RHEL）、\`.AppImage\`（通用）、\`.pkg.tar.zst\`（Arch）

          ## 命令行 / Web 版（无界面 Linux 服务器可用）
          - \`mcode-*.tar.gz\`：TUI + Web + Agent 运行包，需要 Node.js 24+；\`install.sh\` 自动校验 SHA-256 后安装 \`mcode\` 命令。
          - 安装：\`curl -fsSL https://github.com/MAXHONG/mcode/releases/latest/download/install.sh | sh\`
          - 启动：\`mcode --web --host 0.0.0.0 --port 3030 --no-open\`，浏览器打开终端打印的带 token 地址。
          - 部署与 systemd 开机自启：仓库 \`docs/linux-headless-web.md\`。

          ## 自动更新
          - Windows / Linux 桌面版：应用内检测到新版本后可直接下载并在重启时安装。
          - macOS：应用内提示新版本后会打开本页面，请下载新的 DMG 覆盖安装。
          - 命令行 / Web 版：重新执行 \`install.sh\` 即升级到最新版本，用户数据保留。

          ## 安装提示
          - macOS 安装包使用 Developer ID 签名并经苹果公证，可直接打开。
          - Windows 安装包未做代码签名，SmartScreen 提示时选择「更多信息 → 仍要运行」。

          校验值见 \`SHA256SUMS.txt\`。
          EOF
          if [ "$BUILD_RESULT" != "success" ]; then
            cat >> "$NOTES_FILE" <<'EOF'

          > 注意：本次有平台构建失败（常见原因是苹果公证排队超时），对应安装包暂缺，将用 Release Desktop 工作流的 platforms 输入补发到本 Release。
          EOF
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE" "${FLAGS[@]}"
          else
            gh release create "$TAG" dist-release/* \
              --title "Mcode ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --target "${{ github.sha }}" \
              --latest \
              "${FLAGS[@]}"
          fi
