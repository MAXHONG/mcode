    <title>Mcode</title>
    <script>
      (() => {
        // Bugfix: Web 远控跨 workspace 跳转时，JS bundle 还没执行前就会先渲染启动壳。
        // 这里提前按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "mcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };
        const BOOTSTRAP_SNAPSHOT_KEY = "mcode:web-remote-control:bootstrap-shell";

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-mcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          let bootstrapTheme = null;
          const bootstrapSnapshotRaw = window.sessionStorage.getItem(BOOTSTRAP_SNAPSHOT_KEY);
          if (bootstrapSnapshotRaw) {
            window.sessionStorage.removeItem(BOOTSTRAP_SNAPSHOT_KEY);
            try {
              const snapshot = JSON.parse(bootstrapSnapshotRaw);
              if (snapshot && typeof snapshot === "object") {
                const normalizedTheme = snapshot.theme === "dark" ? "dark" : "light";
                bootstrapTheme = normalizedTheme;
                document.documentElement.style.setProperty(
                  "--mcode-bootstrap-bg",
                  typeof snapshot.background === "string"
                    ? snapshot.background
                    : normalizedTheme === "dark"
                      ? "#0f172a"
                      : "#f8fafc",
                );
                document.documentElement.style.setProperty(
                  "--mcode-bootstrap-fg",
                  typeof snapshot.foreground === "string"
                    ? snapshot.foreground
                    : normalizedTheme === "dark"
                      ? "#e2e8f0"
                      : "#334155",
                );
                if (typeof snapshot.border === "string") {
                  document.documentElement.style.setProperty(
                    "--mcode-bootstrap-border",
                    snapshot.border,
                  );
                }
                if (typeof snapshot.card === "string") {
                  document.documentElement.style.setProperty(
                    "--mcode-bootstrap-card",
                    snapshot.card,
                  );
                }
              }
            } catch {
              // ignore invalid snapshot
            }
          }

          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const fallbackTheme = resolved === "dark" ? "dark" : "light";
          const finalTheme = bootstrapTheme ?? fallbackTheme;
          document.documentElement.setAttribute("data-mcode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-mcode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--mcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--mcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-mcode-bootstrap-theme="light"] body {
        background: var(--mcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--mcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-mcode-browser-theme-surface],
      html[data-mcode-browser-theme-surface] body,
      html[data-mcode-browser-theme-surface] #root {
        /* 修复原因：共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--mcode-bootstrap-bg, #161616)) !important;
      }

      html[data-mcode-browser-theme-surface="light"],
      html[data-mcode-browser-theme-surface="light"] body,
      html[data-mcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--mcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .mcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Bugfix: UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。 */
        background: var(--mcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--mcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-mcode-bootstrap-theme="light"] .mcode-boot-loading {
        background: var(--mcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--mcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .mcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .mcode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 修复原因：启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .mcode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Bugfix: 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。 -->
      <div
        class="mcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="mcode-boot-loading__logo-shell">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="118px"
            height="100px"
            fill="none"
            viewBox="0 0 256 218"
            class="mcode-boot-loading__logo"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M0 0Z"
            >
              <animate
                attributeName="opacity"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
            <path fill="currentColor" d="M0 217.736V0H61.44L128 100.159L194.56 0H256V217.736H202.24V87.094L145.92 174.189H110.08L53.76 87.094V217.736Z">
              <animate
                attributeName="opacity"
                begin="0.75s"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
            <path
              fill="currentColor"
              d="M0 0Z"
            >
              <animate
                attributeName="opacity"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
