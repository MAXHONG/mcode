name: Deploy mobile remote page

# Mcode 品牌的手机远控页面（/remote/v4），部署到 GitHub Pages：
# https://maxhong.github.io/mcode/remote/v4/
# 页面通过 z.ai 官方 relay（wss://zcode.z.ai/ws）与桌面端配对，只替换前端品牌。
on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "packages/client/**"
      - ".github/workflows/remote-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build remote page
        env:
          MCODE_ENV: production
          VITE_WEB_REMOTE_CONTROL_ROUTE_PATH: /mcode/remote/v4
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm --filter @mcode/web exec vite build --base=/mcode/remote/v4/ --outDir "$RUNNER_TEMP/remote-v4" --emptyOutDir
      - name: Assemble site
        run: |
          mkdir -p site/remote/v4
          cp -R "$RUNNER_TEMP/remote-v4/." site/remote/v4/
          cp site/remote/v4/index.html site/remote/v4/404.html
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Mcode</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/MAXHONG/mcode">
          <a href="https://github.com/MAXHONG/mcode">Mcode</a>
          HTML
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
